      COMPANY_DELETION_LEASE_MS: ${COMPANY_DELETION_LEASE_MS:-1800000}
      COMPANY_DELETION_MAX_ATTEMPTS: ${COMPANY_DELETION_MAX_ATTEMPTS:-10}
      COMPANY_DELETION_RETRY_BASE_MS: ${COMPANY_DELETION_RETRY_BASE_MS:-60000}
      COMPANY_PROTECTED_IDS: ${COMPANY_PROTECTED_IDS:-}
      COMPANY_PROTECTED_NAMES: ${COMPANY_PROTECTED_NAMES:-Dinamic Systems}
      BOT_SESSION_TTL_MINUTES: ${BOT_SESSION_TTL_MINUTES}
      BOT_OPERATION_TIMEZONE: ${BOT_OPERATION_TIMEZONE}
      BOT_DEFAULT_RADIUS_METERS: ${BOT_DEFAULT_RADIUS_METERS}
      BOT_GEOFENCE_REVIEW_MARGIN_METERS: ${BOT_GEOFENCE_REVIEW_MARGIN_METERS}
      BOT_ON_TIME_GRACE_MINUTES: ${BOT_ON_TIME_GRACE_MINUTES}
      BOT_CHECKOUT_EARLY_TOLERANCE_MINUTES: ${BOT_CHECKOUT_EARLY_TOLERANCE_MINUTES:-15}
      BOT_DEFAULT_COMPANY_ID: ${BOT_DEFAULT_COMPANY_ID:-}
      BOT_DEFAULT_COMPANY_NAME: ${BOT_DEFAULT_COMPANY_NAME:-Dinamic Systems}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/secrets/gcp-service-account.json}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_STORAGE_PREFIX: ${GCS_STORAGE_PREFIX:-absence-attachments}
      GCS_SIGNED_URL_EXPIRATION_SECONDS: ${GCS_SIGNED_URL_EXPIRATION_SECONDS:-300}
      GCS_MAX_FILE_SIZE_BYTES: ${GCS_MAX_FILE_SIZE_BYTES:-5242880}
      GCS_MAX_FILES_PER_REQUEST: ${GCS_MAX_FILES_PER_REQUEST:-5}
      GCS_MAX_TOTAL_SIZE_BYTES: ${GCS_MAX_TOTAL_SIZE_BYTES:-15728640}
      GCS_UPLOAD_MODE: ${GCS_UPLOAD_MODE:-BACKEND_STREAM}
      GCS_REQUIRED: ${GCS_REQUIRED:-false}
      PLATFORM_SERVER_STATUS_CHECK_TIMEOUT_MS: ${PLATFORM_SERVER_STATUS_CHECK_TIMEOUT_MS:-3000}
      API_SERVICE_NAME: ${API_SERVICE_NAME:-dinamic-attendance-api}
      ABSENCE_ATTACHMENT_CLEANUP_JOB_ENABLED: ${ABSENCE_ATTACHMENT_CLEANUP_JOB_ENABLED:-true}
      ABSENCE_ATTACHMENT_PENDING_TTL_MINUTES: ${ABSENCE_ATTACHMENT_PENDING_TTL_MINUTES:-60}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-20000}
