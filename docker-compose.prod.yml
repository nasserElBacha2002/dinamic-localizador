services:
  sqlserver:
    ports: !override []
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: ${TZ:?TZ is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  migrations:
    build:
      target: migrations
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      TZ: ${TZ:?TZ is required}
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:?DB_PORT is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      # Shared fallback. Optional dedicated pair (both or neither) resolved in env-migrations.ts.
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-}
      DB_ENCRYPT: ${DB_ENCRYPT:?DB_ENCRYPT is required}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:?DB_TRUST_SERVER_CERTIFICATE is required}

  backend:
    build:
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      PORT: ${BACKEND_INTERNAL_PORT:?BACKEND_INTERNAL_PORT is required}
      TZ: ${TZ:?TZ is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:?DB_PORT is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_ENCRYPT: ${DB_ENCRYPT:?DB_ENCRYPT is required}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:?DB_TRUST_SERVER_CERTIFICATE is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:?JWT_EXPIRES_IN is required}
      TWO_FACTOR_ISSUER: ${TWO_FACTOR_ISSUER:-Dinamic Attendance}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?TWO_FACTOR_ENCRYPTION_KEY is required}
      TWO_FACTOR_CHALLENGE_SECRET: ${TWO_FACTOR_CHALLENGE_SECRET:?TWO_FACTOR_CHALLENGE_SECRET is required}
      TWO_FACTOR_CHALLENGE_TTL_MINUTES: ${TWO_FACTOR_CHALLENGE_TTL_MINUTES:-5}
      TWO_FACTOR_SETUP_TTL_MINUTES: ${TWO_FACTOR_SETUP_TTL_MINUTES:-10}
      TWO_FACTOR_LOGIN_RATE_LIMIT_WINDOW_MINUTES: ${TWO_FACTOR_LOGIN_RATE_LIMIT_WINDOW_MINUTES:-15}
      TWO_FACTOR_LOGIN_RATE_LIMIT_MAX: ${TWO_FACTOR_LOGIN_RATE_LIMIT_MAX:-8}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?TWILIO_ACCOUNT_SID is required}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?TWILIO_AUTH_TOKEN is required}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:?TWILIO_WHATSAPP_NUMBER is required}
      TWILIO_WEBHOOK_URL: ${TWILIO_WEBHOOK_URL:?TWILIO_WEBHOOK_URL is required}
      TWILIO_VALIDATE_SIGNATURE: ${TWILIO_VALIDATE_SIGNATURE:?TWILIO_VALIDATE_SIGNATURE is required}
      TWILIO_STATUS_CALLBACK_URL: ${TWILIO_STATUS_CALLBACK_URL:-}
      TWILIO_ARRIVAL_REMINDER_CONTENT_SID: ${TWILIO_ARRIVAL_REMINDER_CONTENT_SID:-}
      TWILIO_EXIT_REMINDER_CONTENT_SID: ${TWILIO_EXIT_REMINDER_CONTENT_SID:-}
      TWILIO_TEMPLATE_NO_CHECKIN_SID: ${TWILIO_TEMPLATE_NO_CHECKIN_SID:-}
      TWILIO_ATTENDANCE_CONFIRMATION_CONTENT_SID: ${TWILIO_ATTENDANCE_CONFIRMATION_CONTENT_SID:-}
      TWILIO_PAYROLL_RECEIPT_AVAILABLE_CONTENT_SID: ${TWILIO_PAYROLL_RECEIPT_AVAILABLE_CONTENT_SID:-}
      TWILIO_EVENTUAL_OPERATION_ASSIGNED_CONTENT_SID: ${TWILIO_EVENTUAL_OPERATION_ASSIGNED_CONTENT_SID:-}
      TWILIO_ADMIN_OPERATIONAL_ALERT_CONTENT_SID: ${TWILIO_ADMIN_OPERATIONAL_ALERT_CONTENT_SID:-}
      TWILIO_ADMIN_REQUEST_ALERT_CONTENT_SID: ${TWILIO_ADMIN_REQUEST_ALERT_CONTENT_SID:-}
      ATTENDANCE_REMINDER_JOB_ENABLED: ${ATTENDANCE_REMINDER_JOB_ENABLED:-true}
      OPERATION_LIFECYCLE_JOB_ENABLED: ${OPERATION_LIFECYCLE_JOB_ENABLED:-true}
      OPERATION_LIFECYCLE_JOB_INTERVAL_MS: ${OPERATION_LIFECYCLE_JOB_INTERVAL_MS:-60000}
      OPERATION_LIFECYCLE_JOB_BATCH_SIZE: ${OPERATION_LIFECYCLE_JOB_BATCH_SIZE:-100}
      OPERATION_LIFECYCLE_JOB_MAX_BATCHES_PER_TICK: ${OPERATION_LIFECYCLE_JOB_MAX_BATCHES_PER_TICK:-20}
      PAYROLL_RECEIPT_NOTIFICATION_WORKER_ENABLED: ${PAYROLL_RECEIPT_NOTIFICATION_WORKER_ENABLED:-true}
      PAYROLL_RECEIPT_NOTIFICATION_WORKER_INTERVAL_MS: ${PAYROLL_RECEIPT_NOTIFICATION_WORKER_INTERVAL_MS:-60000}
      PAYROLL_RECEIPT_NOTIFICATION_LEASE_MS: ${PAYROLL_RECEIPT_NOTIFICATION_LEASE_MS:-120000}
      PAYROLL_RECEIPT_NOTIFICATION_MAX_ATTEMPTS: ${PAYROLL_RECEIPT_NOTIFICATION_MAX_ATTEMPTS:-5}
      PAYROLL_RECEIPT_NOTIFICATION_RETRY_BASE_MS: ${PAYROLL_RECEIPT_NOTIFICATION_RETRY_BASE_MS:-30000}
      OPERATION_ASSIGNMENT_NOTIFICATION_WORKER_ENABLED: ${OPERATION_ASSIGNMENT_NOTIFICATION_WORKER_ENABLED:-false}
      OPERATION_ASSIGNMENT_NOTIFICATION_WORKER_INTERVAL_MS: ${OPERATION_ASSIGNMENT_NOTIFICATION_WORKER_INTERVAL_MS:-60000}
      OPERATION_ASSIGNMENT_NOTIFICATION_LEASE_MS: ${OPERATION_ASSIGNMENT_NOTIFICATION_LEASE_MS:-120000}
      OPERATION_ASSIGNMENT_NOTIFICATION_MAX_ATTEMPTS: ${OPERATION_ASSIGNMENT_NOTIFICATION_MAX_ATTEMPTS:-5}
      OPERATION_ASSIGNMENT_NOTIFICATION_RETRY_BASE_MS: ${OPERATION_ASSIGNMENT_NOTIFICATION_RETRY_BASE_MS:-30000}
      ADMIN_ALERT_WORKER_ENABLED: ${ADMIN_ALERT_WORKER_ENABLED:-false}
      ADMIN_ALERT_WORKER_INTERVAL_MS: ${ADMIN_ALERT_WORKER_INTERVAL_MS:-60000}
      ADMIN_ALERT_LEASE_MS: ${ADMIN_ALERT_LEASE_MS:-120000}
      ADMIN_ALERT_MAX_ATTEMPTS: ${ADMIN_ALERT_MAX_ATTEMPTS:-5}
      ADMIN_ALERT_RETRY_BASE_MS: ${ADMIN_ALERT_RETRY_BASE_MS:-30000}
      WHATSAPP_OBSERVABILITY_ENABLED: ${WHATSAPP_OBSERVABILITY_ENABLED:-true}
      WHATSAPP_OBSERVABILITY_UI_ENABLED: ${WHATSAPP_OBSERVABILITY_UI_ENABLED:-true}
      WHATSAPP_TWILIO_STATUS_CALLBACK_ENABLED: ${WHATSAPP_TWILIO_STATUS_CALLBACK_ENABLED:-true}
      WHATSAPP_OBSERVABILITY_PHONE_HASH_SECRET: ${WHATSAPP_OBSERVABILITY_PHONE_HASH_SECRET:?WHATSAPP_OBSERVABILITY_PHONE_HASH_SECRET is required}
      WHATSAPP_OBSERVABILITY_MESSAGE_RETENTION_DAYS: ${WHATSAPP_OBSERVABILITY_MESSAGE_RETENTION_DAYS:-90}
      WHATSAPP_OBSERVABILITY_TEMPLATE_VARS_RETENTION_DAYS: ${WHATSAPP_OBSERVABILITY_TEMPLATE_VARS_RETENTION_DAYS:-90}
      WHATSAPP_OBSERVABILITY_FLOW_RETENTION_DAYS: ${WHATSAPP_OBSERVABILITY_FLOW_RETENTION_DAYS:-90}
      WHATSAPP_OBSERVABILITY_CANDIDATE_RETENTION_DAYS: ${WHATSAPP_OBSERVABILITY_CANDIDATE_RETENTION_DAYS:-90}
      WHATSAPP_OBSERVABILITY_PROVIDER_EVENT_RETENTION_DAYS: ${WHATSAPP_OBSERVABILITY_PROVIDER_EVENT_RETENTION_DAYS:-90}
      WHATSAPP_OBSERVABILITY_CLEANUP_JOB_ENABLED: ${WHATSAPP_OBSERVABILITY_CLEANUP_JOB_ENABLED:-true}
      BOT_SESSION_TTL_MINUTES: ${BOT_SESSION_TTL_MINUTES:?BOT_SESSION_TTL_MINUTES is required}
      BOT_OPERATION_TIMEZONE: ${BOT_OPERATION_TIMEZONE:?BOT_OPERATION_TIMEZONE is required}
      BOT_DEFAULT_RADIUS_METERS: ${BOT_DEFAULT_RADIUS_METERS:?BOT_DEFAULT_RADIUS_METERS is required}
      BOT_GEOFENCE_REVIEW_MARGIN_METERS: ${BOT_GEOFENCE_REVIEW_MARGIN_METERS:?BOT_GEOFENCE_REVIEW_MARGIN_METERS is required}
      BOT_ON_TIME_GRACE_MINUTES: ${BOT_ON_TIME_GRACE_MINUTES:?BOT_ON_TIME_GRACE_MINUTES is required}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports: !override
      - "127.0.0.1:${BACKEND_HOST_PORT}:${BACKEND_INTERNAL_PORT}"
    # Keep only the GCP credentials mount (do not bind-mount source code in prod).
    volumes: !override
      - ./secrets:/app/secrets:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    build: !reset null
    restart: unless-stopped
    depends_on: !override []
    environment: !override {}
    ports: !override
      - "127.0.0.1:${FRONTEND_HOST_PORT}:80"
    volumes: !override []
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
