name: Quality Gate

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: backend-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Validate Docker Compose backend env propagation
        working-directory: ${{ github.workspace }}
        run: python3 scripts/validate-docker-compose-backend-env.py

      - name: Tests
        run: npm test

      # Blocking audit targets runtime/production deps (matches deployed attack surface).
      # Dev-only highs without a patched npm release (e.g. picomatch GHSA-fc5q-39xc-vjpf via ESLint)
      # remain visible in the audit-artifacts job npm audit capture.
      - name: npm audit (high+, production)
        run: npm audit --audit-level=high --omit=dev

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test
        env:
          # happy-dom page suites are memory-heavy; unbound parallel file runs OOM in CI.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: npm audit (high+, production)
        run: npm audit --audit-level=high --omit=dev

  website-quality:
    name: website-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: npm audit (high+, production)
        run: npm audit --audit-level=high --omit=dev

  backend-integration:
    name: backend-integration
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: TestPassword123!
        ports:
          - 1433:1433
    defaults:
      run:
        working-directory: backend
    env:
      RUN_DB_INTEGRATION_TESTS: "true"
      INTEGRATION_SQL_DDL_ALLOWED: "true"
      NODE_ENV: test
      FRONTEND_URL: http://localhost:5173
      TZ: America/Argentina/Buenos_Aires
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "1433"
      TEST_DB_USER: sa
      TEST_DB_PASSWORD: TestPassword123!
      TEST_DB_ENCRYPT: "false"
      TEST_DB_TRUST_SERVER_CERTIFICATE: "true"
      TEST_SQL_DISPOSABLE_ACKNOWLEDGED: "true"
      TEST_SQL_ALLOW_SYSTEM_ADMIN: "true"
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ci-jwt-secret-min-16-chars
      # Seed loads full env.ts (via DB connection) without unit-test preload.
      # Payroll worker defaults to true and fail-fast requires a Content SID.
      PAYROLL_RECEIPT_NOTIFICATION_WORKER_ENABLED: "false"
      TWILIO_VALIDATE_SIGNATURE: "false"
      TWILIO_ACCOUNT_SID: AC_CI_TEST
      TWILIO_AUTH_TOKEN: ci-test-twilio-auth-token
      TWILIO_WHATSAPP_NUMBER: "whatsapp:+10000000000"
      TWILIO_ARRIVAL_REMINDER_CONTENT_SID: HX_CI_ARRIVAL
      TWILIO_EXIT_REMINDER_CONTENT_SID: HX_CI_EXIT
      TWILIO_TEMPLATE_NO_CHECKIN_SID: HX_CI_NO_CHECKIN
      TWILIO_PAYROLL_RECEIPT_AVAILABLE_CONTENT_SID: HX_CI_PAYROLL
      TWILIO_ADMIN_OPERATIONAL_ALERT_CONTENT_SID: HX_CI_ADMIN_OPS
      TWILIO_ADMIN_REQUEST_ALERT_CONTENT_SID: HX_CI_ADMIN_REQ
      ADMIN_ALERT_WORKER_ENABLED: "false"
      DAILY_ATTENDANCE_REPORT_WORKER_ENABLED: "false"
      WHATSAPP_MESSAGE_COST_SYNC_WORKER_ENABLED: "false"
      EMAIL_TRANSPORT: console
      GCS_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            if docker run --rm --network host mcr.microsoft.com/mssql-tools \
              /opt/mssql-tools/bin/sqlcmd \
              -S localhost -U sa -P "$TEST_DB_PASSWORD" \
              -Q "SELECT 1" -C >/dev/null 2>&1; then
              echo "SQL Server is ready"
              exit 0
            fi
            echo "Waiting for SQL Server (${i}/30)..."
            sleep 5
          done
          echo "SQL Server did not become ready in time"
          exit 1

      - name: Resolve disposable SQL Server identity
        run: |
          IDENTITY=$(docker run --rm --network host mcr.microsoft.com/mssql-tools \
            /opt/mssql-tools/bin/sqlcmd \
            -S localhost -U sa -P "$TEST_DB_PASSWORD" -C -h -1 \
            -Q "SET NOCOUNT ON; SELECT CAST(@@SERVERNAME AS NVARCHAR(256))")
          IDENTITY=$(echo "$IDENTITY" | tr -d '[:space:]')
          echo "TEST_SQL_ALLOWED_SERVER_NAME=$IDENTITY" >> "$GITHUB_ENV"
          echo "Resolved TEST_SQL_ALLOWED_SERVER_NAME=$IDENTITY"

      - name: Integration tests (ephemeral database)
        run: npm run test:integration
        env:
          EMAIL_TRANSPORT: console
          NODE_ENV: test
          ADMIN_NAME: CI Platform Admin
          ADMIN_EMAIL: admin@dinamicsystems.com
          ADMIN_PASSWORD: ci-test-password-123
          INTEGRATION_EPHEMERAL_BILLING_DDL_ALLOWED: "true"

  audit-artifacts:
    name: audit-artifacts
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - frontend-quality
      - website-quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run local audit (non-blocking findings)
        run: npm run audit
        continue-on-error: true

      - name: Enforce strict quality gate on critical checks
        run: python3 scripts/audit/enforce_quality_gate.py --strict

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: |
            audit/audit-summary.md
            audit/audit-status.json
            audit/raw/
