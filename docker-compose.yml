      PAYROLL_RECEIPTS_MAX_FILES_PER_BATCH: ${PAYROLL_RECEIPTS_MAX_FILES_PER_BATCH:-50}
      COMPANY_DELETION_GRACE_PERIOD_DAYS: ${COMPANY_DELETION_GRACE_PERIOD_DAYS:-30}
      COMPANY_DELETION_JOB_ENABLED: ${COMPANY_DELETION_JOB_ENABLED:-true}
