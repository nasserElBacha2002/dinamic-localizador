      - "${BACKEND_HOST_PORT}:${BACKEND_INTERNAL_PORT}"
    volumes:
      # GCP ADC for absence attachments (host: repo secrets/ → /app/secrets/)
      - ./secrets:/app/secrets:ro
      # - ./backend:/app
      # - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID}
    container_name: dinamic-attendance-frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
      VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID}
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    #volumes:
     # - ./frontend:/app
      #- /app/node_modules6
volumes:
  sqlserver_data:
    name: dinamic-attendance_sqlserver_data
