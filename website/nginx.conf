server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El contenedor solo habla HTTP. Con absolute_redirect on (default),
    # `return 301 /ruta/` se absolutiza como http://$host/ruta/ y, detrás del
    # proxy HTTPS del apex, degrada el esquema (cadena de 2 saltos).
    absolute_redirect off;
    charset utf-8;

    error_page 404 /404.html;

    location = /404.html {
        internal;
        default_type text/html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /marketing-assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /brand/ {
        try_files $uri =404;
    }

    location /marketing/ {
        try_files $uri =404;
    }

    location /video/ {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        charset utf-8;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /index.html {
        return 301 /$is_args$args;
    }

    location = /software-empresas-limpieza {
        return 301 /software-empresas-limpieza/$is_args$args;
    }

    location = /software-empresas-limpieza/ {
        try_files /software-empresas-limpieza/index.html =404;
        add_header Referrer-Policy "no-referrer" always;
    }

    location ~ ^/software-empresas-limpieza/.+ {
        return 404;
    }

    location ~ ^/software-empresas-limpieza[^/]+$ {
        return 404;
    }

    location = /privacidad {
        return 301 /privacidad/$is_args$args;
    }

    location = /privacidad/ {
        try_files /privacidad/index.html =404;
        add_header Referrer-Policy "no-referrer" always;
    }

    location ~ ^/privacidad/.+ {
        return 404;
    }

    location ~ ^/privacidad[^/]+$ {
        return 404;
    }

    location = / {
        try_files /index.html =404;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Rutas no publicadas. En el apex separado, /login y el resto de rutas de la
    # app redirigen a app.dinamicoperations.com antes de llegar a este contenedor.
    location / {
        return 404;
    }
}
