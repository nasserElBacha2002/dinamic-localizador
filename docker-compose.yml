      WHATSAPP_OBSERVABILITY_CANDIDATE_RETENTION_DAYS: ${WHATSAPP_OBSERVABILITY_CANDIDATE_RETENTION_DAYS:-90}
      WHATSAPP_OBSERVABILITY_PROVIDER_EVENT_RETENTION_DAYS: ${WHATSAPP_OBSERVABILITY_PROVIDER_EVENT_RETENTION_DAYS:-90}
      WHATSAPP_OBSERVABILITY_CLEANUP_JOB_ENABLED: ${WHATSAPP_OBSERVABILITY_CLEANUP_JOB_ENABLED:-true}
