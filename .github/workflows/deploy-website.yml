name: Deploy Website (develop)

on:
  push:
    branches:
      - develop
    paths:
      - "website/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-website.yml"
      - ".github/scripts/deploy-website.sh"
      - ".github/scripts/deploy-compose.sh"

concurrency:
  group: dinamic-attendance-deploy-develop
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: website-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  build-and-push:
    name: build-and-push-website-image
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      website_image: ${{ steps.image.outputs.website_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase GHCR image name
        id: image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY}/website"
          IMAGE_NAME="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "website_image=${IMAGE_NAME}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push website production image
        uses: docker/build-push-action@v6
        with:
          context: ./website
          file: ./website/Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.image.outputs.image_name }}:${{ github.sha }}
            ${{ steps.image.outputs.image_name }}:develop-latest
          build-args: |
            VITE_OPERATIONS_APP_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy-website
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      WEBSITE_IMAGE: ${{ needs.build-and-push.outputs.website_image }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_USERNAME: ${{ github.repository_owner }}
    steps:
      - name: Deploy website via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          WEBSITE_IMAGE: ${{ needs.build-and-push.outputs.website_image }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PULL_USERNAME: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          timeout: 30s
          command_timeout: 15m
          envs: WEBSITE_IMAGE,GHCR_PULL_TOKEN,GHCR_PULL_USERNAME
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "${DEPLOY_PATH}" ]; then
              DEPLOY_PATH="/opt/dinamic-attendance/dinamic-localizador"
            fi
            cd "${DEPLOY_PATH}"
            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop
            export DEPLOY_PATH
            export DEPLOY_BRANCH="develop"
            export DEPLOY_WEBSITE_HEALTH_URL="${{ vars.DEPLOY_WEBSITE_HEALTH_URL }}"
            bash "${DEPLOY_PATH}/.github/scripts/deploy-website.sh"
