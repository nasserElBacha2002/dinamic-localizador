name: dinamic-attendance

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dinamic-attendance-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
    expose:
      - "${DB_PORT}"
    ports:
      - "1435:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: dinamic-attendance-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./database/init/init.sql:/init/init.sql:ro
    command:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools/bin/sqlcmd
        -S sqlserver
        -U sa
        -P "$${DB_PASSWORD}"
        -C
        -i /init/init.sql
    restart: "no"

  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrations
    container_name: dinamic-attendance-migrations
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV}
      TZ: ${TZ}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      # Shared fallback identity. Optional dedicated pair resolved only in env-migrations.ts.
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-}
      DB_ENCRYPT: ${DB_ENCRYPT}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE}
      MIGRATIONS_DIR: /database/migrations
    volumes:
      - ./database:/database:ro
    command: ["npm", "run", "migrate"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: dinamic-attendance-backend
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      migrations:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_INTERNAL_PORT}
      TZ: ${TZ}
      FRONTEND_URL: ${FRONTEND_URL}
      APP_BASE_URL: ${APP_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ENCRYPT: ${DB_ENCRYPT}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      TWO_FACTOR_ISSUER: ${TWO_FACTOR_ISSUER:-Dinamic Attendance}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
      TWO_FACTOR_CHALLENGE_SECRET: ${TWO_FACTOR_CHALLENGE_SECRET}
      TWO_FACTOR_CHALLENGE_TTL_MINUTES: ${TWO_FACTOR_CHALLENGE_TTL_MINUTES:-5}
      TWO_FACTOR_SETUP_TTL_MINUTES: ${TWO_FACTOR_SETUP_TTL_MINUTES:-10}
      TWO_FACTOR_LOGIN_RATE_LIMIT_WINDOW_MINUTES: ${TWO_FACTOR_LOGIN_RATE_LIMIT_WINDOW_MINUTES:-15}
      TWO_FACTOR_LOGIN_RATE_LIMIT_MAX: ${TWO_FACTOR_LOGIN_RATE_LIMIT_MAX:-8}
      INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-72}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-60}
      PASSWORD_RESET_MIN_DURATION_MS: ${PASSWORD_RESET_MIN_DURATION_MS:-300}
      PASSWORD_RESET_DURATION_JITTER_MS: ${PASSWORD_RESET_DURATION_JITTER_MS:-150}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_MINUTES: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_MINUTES:-15}
      AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-10}
      PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES:-15}
      PASSWORD_RESET_RATE_LIMIT_MAX: ${PASSWORD_RESET_RATE_LIMIT_MAX:-5}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      TWILIO_WEBHOOK_URL: ${TWILIO_WEBHOOK_URL}
      TWILIO_VALIDATE_SIGNATURE: ${TWILIO_VALIDATE_SIGNATURE}
      TWILIO_ARRIVAL_REMINDER_CONTENT_SID: ${TWILIO_ARRIVAL_REMINDER_CONTENT_SID}
      TWILIO_EXIT_REMINDER_CONTENT_SID: ${TWILIO_EXIT_REMINDER_CONTENT_SID}
      TWILIO_TEMPLATE_NO_CHECKIN_SID: ${TWILIO_TEMPLATE_NO_CHECKIN_SID}
      TWILIO_ATTENDANCE_CONFIRMATION_CONTENT_SID: ${TWILIO_ATTENDANCE_CONFIRMATION_CONTENT_SID:-}
      TWILIO_PAYROLL_RECEIPT_AVAILABLE_CONTENT_SID: ${TWILIO_PAYROLL_RECEIPT_AVAILABLE_CONTENT_SID:-}
      TWILIO_EVENTUAL_OPERATION_ASSIGNED_CONTENT_SID: ${TWILIO_EVENTUAL_OPERATION_ASSIGNED_CONTENT_SID:-}
