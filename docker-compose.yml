      RECURRING_WORKDAY_MATERIALIZATION_JOB_ENABLED: ${RECURRING_WORKDAY_MATERIALIZATION_JOB_ENABLED:-true}
      OPERATION_LIFECYCLE_JOB_ENABLED: ${OPERATION_LIFECYCLE_JOB_ENABLED:-true}
      OPERATION_LIFECYCLE_JOB_INTERVAL_MS: ${OPERATION_LIFECYCLE_JOB_INTERVAL_MS:-60000}
      OPERATION_LIFECYCLE_JOB_BATCH_SIZE: ${OPERATION_LIFECYCLE_JOB_BATCH_SIZE:-100}
      OPERATION_LIFECYCLE_JOB_MAX_BATCHES_PER_TICK: ${OPERATION_LIFECYCLE_JOB_MAX_BATCHES_PER_TICK:-20}
      PAYROLL_RECEIPT_NOTIFICATION_WORKER_ENABLED: ${PAYROLL_RECEIPT_NOTIFICATION_WORKER_ENABLED:-true}
      PAYROLL_RECEIPT_NOTIFICATION_WORKER_INTERVAL_MS: ${PAYROLL_RECEIPT_NOTIFICATION_WORKER_INTERVAL_MS:-60000}
      PAYROLL_RECEIPT_NOTIFICATION_LEASE_MS: ${PAYROLL_RECEIPT_NOTIFICATION_LEASE_MS:-120000}
      PAYROLL_RECEIPT_NOTIFICATION_MAX_ATTEMPTS: ${PAYROLL_RECEIPT_NOTIFICATION_MAX_ATTEMPTS:-5}
      PAYROLL_RECEIPT_NOTIFICATION_RETRY_BASE_MS: ${PAYROLL_RECEIPT_NOTIFICATION_RETRY_BASE_MS:-30000}
      OPERATION_ASSIGNMENT_NOTIFICATION_WORKER_ENABLED: ${OPERATION_ASSIGNMENT_NOTIFICATION_WORKER_ENABLED:-false}
      OPERATION_ASSIGNMENT_NOTIFICATION_WORKER_INTERVAL_MS: ${OPERATION_ASSIGNMENT_NOTIFICATION_WORKER_INTERVAL_MS:-60000}
